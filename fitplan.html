<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitPlan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF9F6;
    --card:#FFFFFF;
    --ink:#201F1D;
    --ink-soft:#5B5854;
    --line:#E4E0D8;
    --line-soft:#EEEBE4;
    --indigo:#33406B;
    --indigo-soft:#E8EAF1;
    --clay:#C1502E;
    --clay-soft:#F5E4DC;
    --moss:#59713F;
    --moss-soft:#E7EDDE;
    --plum:#6B4058;
    --plum-soft:#EEE2E8;
    --danger:#B23A3A;
    --radius-sm:4px;
    --radius-md:10px;
    --radius-lg:20px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#E9E5DC;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    min-height:100vh;
    padding:28px 12px;
  }
  h1,h2,h3,.numeral{font-family:'Fraunces',Georgia,serif;}
  .app-shell{width:100%;max-width:420px;}
  .phone{
    background:var(--paper);
    border-radius:32px;
    border:1px solid #D8D3C8;
    box-shadow:0 30px 60px -20px rgba(32,31,29,0.35);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:844px;
    max-height:88vh;
    position:relative;
  }
  .statusbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 24px 4px;
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .screen{
    flex:1;
    overflow-y:auto;
    padding:8px 22px 24px;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none;}
  .bottomnav{
    flex-shrink:0;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--card);
    padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .navitem{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;font-family:inherit;
    padding:6px 2px;
    cursor:pointer;
    color:#B7B2A8;
    font-size:11.5px;
  }
  .navitem .navicon{font-size:19px;line-height:1;}
  .navitem.active{color:var(--ink);}
  .navitem.active .navicon{transform:translateY(-1px);}
  .navitem[data-tab="home"].active{color:var(--ink);}
  .navitem[data-tab="workout"].active{color:var(--clay);}
  .navitem[data-tab="meals"].active{color:var(--moss);}
  .navitem[data-tab="progress"].active{color:var(--plum);}
  .navitem[data-tab="profile"].active{color:var(--indigo);}

  .eyebrow{font-size:13px;color:var(--ink-soft);margin:0 0 2px;}
  .h-page{font-size:26px;font-weight:600;margin:2px 0 18px;letter-spacing:-0.01em;}
  .h-section{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;}
  p{line-height:1.5;}
  .muted{color:var(--ink-soft);}
  .small{font-size:13px;}

  .btn{
    font-family:'Inter',sans-serif;
    font-size:15px;font-weight:600;
    border-radius:var(--radius-sm);
    padding:13px 18px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    width:100%;
    text-align:center;
  }
  .btn:active{opacity:0.8;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:none;font-weight:500;}
  .btn.small-btn{width:auto;padding:8px 14px;font-size:13px;}
  .btn.clay{background:var(--clay);border-color:var(--clay);}
  .btn.moss{background:var(--moss);border-color:var(--moss);}
  .btn.indigo{background:var(--indigo);border-color:var(--indigo);}
  .btn.plum{background:var(--plum);border-color:var(--plum);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  .row{display:flex;gap:10px;}
  .col{flex:1;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field select,.field textarea{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);
    font-family:inherit;font-size:15px;background:var(--card);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .seg{display:flex;flex-wrap:wrap;gap:8px;}
  .seg-opt{
    border:1px solid var(--line);background:var(--card);border-radius:var(--radius-md);
    padding:12px 14px;cursor:pointer;font-size:14px;flex:1 1 auto;text-align:center;min-width:80px;
  }
  .seg-opt.wide{flex-basis:100%;text-align:left;display:flex;align-items:center;gap:10px;}
  .seg-opt .opt-title{font-weight:600;font-size:14.5px;}
  .seg-opt .opt-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .seg-opt.selected{border-color:var(--ink);background:#F1EFE9;}
  .seg-opt.selected.c-indigo{border-color:var(--indigo);background:var(--indigo-soft);}
  .seg-opt.selected.c-clay{border-color:var(--clay);background:var(--clay-soft);}
  .seg-opt.selected.c-moss{border-color:var(--moss);background:var(--moss-soft);}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:13px;cursor:pointer;background:var(--card);
  }
  .chip.selected{border-color:var(--ink);background:#F1EFE9;}
  .chip input{margin:0;}

  .divider{height:1px;background:var(--line);margin:18px 0;border:none;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;}
  .card.flat{border-radius:var(--radius-md);}

  .progress-track{height:6px;background:var(--line-soft);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:6px;background:var(--ink);}
  .progress-fill.clay{background:var(--clay);}
  .progress-fill.moss{background:var(--moss);}
  .progress-fill.indigo{background:var(--indigo);}
  .progress-fill.plum{background:var(--plum);}

  .metric-num{font-size:34px;font-weight:600;line-height:1;}
  .metric-label{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .onboard-progress{display:flex;gap:5px;margin:10px 0 20px;}
  .onboard-progress span{flex:1;height:3px;border-radius:3px;background:var(--line);}
  .onboard-progress span.done{background:var(--ink);}
  .onboard-step{animation:slideIn .32s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}

  .weekcal{display:flex;gap:5px;margin-bottom:16px;}
  .daybox{flex:1;text-align:center;padding:9px 2px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;}
  .daybox .dname{font-size:11px;color:var(--ink-soft);}
  .daybox .dmark{font-size:15px;margin-top:3px;}
  .daybox.today{border-color:var(--clay);}
  .daybox.selected{background:var(--clay-soft);border-color:var(--clay);}

  .exrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .exrow:last-child{border-bottom:none;}
  .exnum{width:26px;height:26px;border-radius:50%;background:var(--clay-soft);color:var(--clay);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .exname{font-weight:600;font-size:14.5px;}
  .exsub{font-size:12.5px;color:var(--ink-soft);}

  .mealcard{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
  .mealcard:last-child{border-bottom:none;}
  .mealtag{font-size:11.5px;color:var(--moss);font-weight:600;}
  .mealname{font-weight:600;font-size:15px;margin:2px 0 3px;cursor:pointer;}
  .mealkcal{font-size:12.5px;color:var(--ink-soft);}
  .checkbtn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;cursor:pointer;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;}
  .checkbtn.done{background:var(--moss);border-color:var(--moss);color:#fff;}

  .modal-overlay{position:absolute;inset:0;background:rgba(32,31,29,0.55);display:flex;align-items:flex-end;z-index:50;}
  .modal-sheet{background:var(--paper);width:100%;max-height:92%;border-radius:22px 22px 0 0;padding:20px 22px 26px;overflow-y:auto;animation:sheetUp .28s ease;}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-close{background:none;border:none;font-size:14px;color:var(--ink-soft);cursor:pointer;padding:4px 0;}
  .fullscreen-modal{position:absolute;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column;padding:18px 22px 22px;}

  .setpill{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;}
  .setpill.done{background:var(--clay);border-color:var(--clay);color:#fff;}
  .rest-ring{font-size:52px;font-weight:600;text-align:center;font-family:'Fraunces',serif;}

  .weight-chip{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px;}
  .weight-chip:last-child{border-bottom:none;}

  .banner{border-radius:var(--radius-md);padding:13px 14px;font-size:13.5px;margin-bottom:14px;line-height:1.45;}
  .banner.warn{background:var(--clay-soft);color:#7A3416;}
  .banner.info{background:var(--indigo-soft);color:var(--indigo);}

  ::selection{background:#DCD5C4;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--indigo);outline-offset:1px;}
</style>
</head>

const ACTIVITY_LABELS = {sedentary:'Ít vận động',light:'Nhẹ',moderate:'Vừa',high:'Cao',veryhigh:'Rất cao'};

/* ================= PERSISTENCE (localStorage) ================= */
const STORAGE_KEY = 'fitplan_state_v1';

function saveState(){
  try{
    const snapshot = {
      onboarded: state.onboarded,
      obStep: state.obStep,
      currentTab: state.currentTab,
      profile: state.profile,
      activity: state.activity,
      goal: state.goal,
      workoutPrefs: state.workoutPrefs,
      foodPrefs: state.foodPrefs,
      metrics: state.metrics,
      plan: state.plan,
      logs: {
        weightHistory: state.logs.weightHistory,
        workoutHistory: state.logs.workoutHistory,
      },
      today: state.today,
      selectedDayIndex: state.selectedDayIndex,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
  }catch(e){
    console.warn('Không thể lưu trạng thái:', e);
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data.logs){
      if(Array.isArray(data.logs.weightHistory)){
        data.logs.weightHistory = data.logs.weightHistory.map(h=>({...h, date: h.date ? new Date(h.date) : new Date()}));
      }
      if(Array.isArray(data.logs.workoutHistory)){
        data.logs.workoutHistory = data.logs.workoutHistory.map(h=>({...h, date: h.date ? new Date(h.date) : new Date()}));
      }
    }
    state = Object.assign({}, state, data, {session:null});
    return true;
  }catch(e){
    console.warn('Không thể đọc trạng thái đã lưu:', e);
    return false;
  }
}

function clearState(){

}

/* ================= CALC ENGINE ================= */
function calcMetrics(){
  const w=parseFloat(state.profile.weight), h=parseFloat(state.profile.height), a=parseInt(state.profile.age);
  const bmi = w/((h/100)*(h/100));
  const bmr = state.profile.sex==='nam' ? (10*w+6.25*h-5*a+5) : (10*w+6.25*h-5*a-161);
  const tdee = bmr*ACTIVITY_MULT[state.activity];
  const isMinor = a<18;
  let target, note=null;
  if(isMinor){
    target = tdee;
    note = 'Bạn dưới 18 tuổi nên FitPlan chưa tự đặt mục tiêu giảm cân hoặc tăng cân cho bạn. Mức năng lượng bên dưới là mức duy trì; hãy trao đổi với phụ huynh hoặc chuyên gia y tế nếu muốn thay đổi cân nặng.';
  } else if(state.goal==='fat_loss'){
    const deficit = Math.min(500, tdee*0.2);
    target = Math.max(tdee-deficit, Math.max(1200, bmr*1.05));
  } else if(state.goal==='muscle_gain'){
    target = tdee + Math.min(300, tdee*0.15);
  } else {
    target = tdee;
  }
  const proteinPerKg = state.goal==='muscle_gain'?2.2 : state.goal==='fat_loss'?2.0 : 1.6;
  const protein = Math.round(proteinPerKg*w);
  const fat = Math.round((0.25*target)/9);
  const carbs = Math.max(0, Math.round((target - protein*4 - fat*9)/4));
  let bmiLabel, bmiPos;
  if(bmi<18.5){bmiLabel='Thiếu cân';bmiPos=(bmi/18.5)*25;}
  else if(bmi<25){bmiLabel='Bình thường';bmiPos=25+((bmi-18.5)/6.5)*25;}
  else if(bmi<30){bmiLabel='Thừa cân';bmiPos=50+((bmi-25)/5)*25;}
  else {bmiLabel='Béo phì';bmiPos=Math.min(100,75+((bmi-30)/8)*25);}
  state.metrics = {bmi:+bmi.toFixed(1), bmiLabel, bmiPos:Math.min(100,Math.max(0,bmiPos)), bmr:Math.round(bmr), tdee:Math.round(tdee), target:Math.round(target), protein, carbs, fat, isMinor, note};
}

/* ================= PLAN GENERATION ================= */
const SLOTS = {
  full:['chan','nguc','lung','vai','tay','bung','cardio'],
  upper:['nguc','lung','vai','tay','bung','lung','vai'],
  lower:['chan','chan','bung','cardio','chan','bung','chan'],
  push:['nguc','vai','tay','nguc','bung','vai','tay'],
  pull:['lung','tay','lung','vai','bung','lung','tay'],
};
function dayPattern(days){
  if(days<=2) return ['full','rest','full','rest','rest','rest','rest'];
  if(days===3) return ['full','rest','full','rest','full','rest','rest'];
  if(days===4) return ['upper','lower','rest','upper','lower','rest','rest'];
  if(days===5) return ['push','pull','lower','rest','push','pull','rest'];
  return ['push','pull','lower','push','pull','lower','rest'];
}
function exCountFromDuration(duration){
  if(duration<=20) return 4;
  if(duration<=30) return 5;
  if(duration<=45) return 6;
  return 7;
}
function pickExercise(group, usedIds, equipment, location){
  let pool = EXLIB.filter(e=>e.group===group && !usedIds.has(e.id) && e.loc.includes(location) && e.equip.some(eq=>equipment.includes(eq)));
  if(pool.length===0){
    pool = EXLIB.filter(e=>e.group===group && !usedIds.has(e.id) && e.equip.includes('none'));
  }
  if(pool.length===0){
    pool = EXLIB.filter(e=>e.group===group && e.equip.includes('none'));
  }
  return pool[0] || null;
}
function generateWorkoutPlan(){
  const prefs = state.workoutPrefs;
  const pattern = dayPattern(prefs.days);
  const count = exCountFromDuration(prefs.duration);
  const week = pattern.map((type,i)=>{
    if(type==='rest') return {day:WEEKDAYS[i], type:'rest', exercises:[]};
    const slots = SLOTS[type].slice(0,count);
    const used = new Set();
    const exercises = [];
    slots.forEach(group=>{
      const ex = pickExercise(group, used, prefs.equipment, prefs.location);
      if(ex){ used.add(ex.id); exercises.push(ex); }
    });
    const typeLabel = {full:'Toàn thân',upper:'Thân trên',lower:'Thân dưới',push:'Đẩy (Push)',pull:'Kéo (Pull)'}[type];
    return {day:WEEKDAYS[i], type, typeLabel, exercises};
  });
  state.plan.workoutWeek = week;
}
function generateMealPlan(){
  const fp = state.foodPrefs;
  const dietKey = fp.diet==='unrestricted' || fp.diet==='halal' || fp.diet==='other' ? 'any' : fp.diet;
  const targetSplit = {breakfast:0.25, lunch:0.35, dinner:0.30, snack:0.10};
  const total = state.metrics.target;
  const dislikeWords = fp.dislikes.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
  function filterPool(type, relaxDislikes){
    return MEALLIB.filter(m=>{
      if(m.type!==type) return false;
      if(dietKey!=='any' && !m.diet.includes(dietKey)) return false;
      if(m.allergens.some(a=>fp.allergies.includes(a))) return false;
      if(!relaxDislikes && dislikeWords.some(w=> m.name.toLowerCase().includes(w) || m.ing.join(' ').toLowerCase().includes(w))) return false;
      return true;
    });
  }
  const plan = {};
  Object.keys(targetSplit).forEach(type=>{
    const slotTarget = total*targetSplit[type];
    let pool = filterPool(type, false);
    if(pool.length===0) pool = filterPool(type, true);
    if(pool.length===0) pool = MEALLIB.filter(m=>m.type===type);
    pool = pool.slice().sort((a,b)=>Math.abs(a.kcal-slotTarget)-Math.abs(b.kcal-slotTarget));
    plan[type] = pool[0];
  });
  state.plan.mealDay = plan;
}

}
function allergyChip(val,label){

  return `<span class="chip ${sel?'selected':''}" onclick="toggleAllergy('${val}')">${label}</span>`;
}
function setField(field,val){ state[field]=val; renderOnboarding(); }
function setGoal(val){ state.goal=val; renderOnboarding(); }
function setWP(k,v){ state.workoutPrefs[k]=v; renderOnboarding(); }
function setFP(k,v){ state.foodPrefs[k]=v; renderOnboarding(); }
function toggleEquip(val){
  const eq = state.workoutPrefs.equipment;
  if(val==='none'){ state.workoutPrefs.equipment=['none']; renderOnboarding(); return; }
  const i = eq.indexOf(val);
  if(i>-1) eq.splice(i,1); else eq.push(val);
  const ni = eq.indexOf('none'); if(ni>-1 && eq.length>1) eq.splice(ni,1);
  if(eq.length===0) eq.push('none');
  renderOnboarding();
}
function toggleAllergy(val){
  const a = state.foodPrefs.allergies;
  const i = a.indexOf(val);
  if(i>-1) a.splice(i,1); else a.push(val);
  renderOnboarding();
}
function obNext(){ state.obStep++; renderOnboarding(); }
function obBack(){ if(state.obStep>0) state.obStep--; renderOnboarding(); }

  const height=el('ob-height').value;
  const weight=el('ob-weight').value;

    alert('Vui lòng nhập đầy đủ tuổi, chiều cao và cân nặng hợp lệ.');

  state.profile = {name:name||'Bạn', age, sex, height, weight};

}

  state.foodPrefs.dislikes = el('ob-dislikes').value.trim();

  renderHome();
}

/* ---- workout session flow ---- */
function startWorkoutSession(dayIdx){
  const day = state.plan.workoutWeek[dayIdx];
  if(day.exercises.length===0) return;
  state.session = {dayIdx, exIdx:0, setDone:0, phase:'exercise', timer:null, remaining:0};
  renderSession();
}
function currentSessionExercise(){
  const s = state.session;
  return state.plan.workoutWeek[s.dayIdx].exercises[s.exIdx];
}
function renderSession(){
  const s = state.session;
  const day = state.plan.workoutWeek[s.dayIdx];
  const root = document.getElementById('modal-root');
  if(s.phase==='summary'){
    const totalSets = day.exercises.reduce((sum,ex)=>sum+ex.sets,0);
    root.innerHTML = `
      <div class="fullscreen-modal" style="align-items:center;justify-content:center;text-align:center;">
        <div style="font-size:44px;">🎉</div>
        <h2 style="font-size:24px;font-weight:600;margin:14px 0 4px;">Hoàn thành buổi tập</h2>
        <p class="muted" style="margin:0 0 24px;">${day.typeLabel} · ${day.exercises.length} bài tập · ${totalSets} hiệp</p>
        <button class="btn clay" style="max-width:220px;" onclick="finishSession()">Xong</button>
      </div>`;
    return;
  }
  const ex = currentSessionExercise();
  if(s.phase==='exercise'){
    const pills = Array.from({length:ex.sets}).map((_,i)=>`<div class="setpill ${i<s.setDone?'done':''}">${i+1}</div>`).join('');
    root.innerHTML = `
      <div class="fullscreen-modal">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span class="small muted">Bài ${s.exIdx+1} / ${day.exercises.length}</span>
          <button class="modal-close" onclick="closeSession()">Thoát</button>
        </div>
        <div class="progress-track" style="margin-bottom:22px;"><div class="progress-fill clay" style="width:${(s.exIdx/day.exercises.length)*100}%"></div></div>
        <h2 style="font-size:26px;font-weight:600;margin:0 0 6px;">${ex.name}</h2>
        <p class="muted" style="margin:0 0 20px;">${ex.reps} mỗi hiệp</p>
        <p class="small muted" style="margin:0 0 10px;">${ex.cue}</p>
        <div style="flex:1;"></div>
        <div style="display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;">${pills}</div>
        <button class="btn clay" onclick="completeSet()">Hoàn thành hiệp ${s.setDone+1}</button>
      </div>`;
  } else if(s.phase==='rest'){
    root.innerHTML = `
      <div class="fullscreen-modal" style="align-items:center;justify-content:center;text-align:center;">
        <p class="muted" style="margin:0 0 8px;">Nghỉ giữa hiệp</p>
        <div class="rest-ring" id="rest-num">${s.remaining}</div>
        <p class="small muted" style="margin:14px 0 26px;">Bài tiếp theo: ${s.exIdx+1<day.exercises.length ? day.exercises[s.exIdx+ (s.setDone>=ex.sets?1:0)]?.name || ex.name : 'Hoàn tất'}</p>
        <button class="btn secondary" style="max-width:200px;" onclick="skipRest()">Bỏ qua nghỉ</button>
      </div>`;
    clearInterval(s.timer);
    s.timer = setInterval(()=>{
      s.remaining--;
      const numEl = document.getElementById('rest-num');
      if(numEl) numEl.textContent = s.remaining;
      if(s.remaining<=0){ clearInterval(s.timer); afterRest(); }
    },1000);
  }
}
function completeSet(){
  const s = state.session;
  const ex = currentSessionExercise();
  s.setDone++;
  if(s.setDone>=ex.sets){
    if(s.exIdx>=state.plan.workoutWeek[s.dayIdx].exercises.length-1){
      s.phase='summary'; renderSession(); return;
    }
    s.phase='rest'; s.remaining=ex.rest; renderSession();
  } else {
    s.phase='rest'; s.remaining=ex.rest; renderSession();
  }
}
function afterRest(){
  const s = state.session;
  const day = state.plan.workoutWeek[s.dayIdx];
  const ex = day.exercises[s.exIdx];
  if(s.setDone>=ex.sets){
    s.exIdx++; s.setDone=0;
    if(s.exIdx>=day.exercises.length){ s.phase='summary'; renderSession(); return; }
  }
  s.phase='exercise';
  renderSession();
}
function skipRest(){ clearInterval(state.session.timer); afterRest(); }
function closeSession(){ clearInterval(state.session?.timer); state.session=null; closeModal(); renderWorkoutTab(); }
function finishSession(){
  const s = state.session;
  const dayIdx = s.dayIdx;
  if(!state.logs.workoutHistory.find(h=>h.dayIndex===dayIdx && sameWeek(h.date))){
    state.logs.workoutHistory.push({dayIndex:dayIdx, date:new Date()});
  }
  if(dayIdx===todayIndex()) state.today.workoutDone = true;
  state.session=null;
  closeModal();
  renderNav();
  renderCurrentTab();
}
function sameWeek(d){ return true; }

  const meals = state.plan.mealDay;
  const loggedKcal = Object.keys(state.today.mealsLogged).filter(k=>state.today.mealsLogged[k]).reduce((s,k)=>s+meals[k].kcal,0);
  const loggedP = Object.keys(state.today.mealsLogged).filter(k=>state.today.mealsLogged[k]).reduce((s,k)=>s+meals[k].p,0);
  const loggedC = Object.keys(state.today.mealsLogged).filter(k=>state.today.mealsLogged[k]).reduce((s,k)=>s+meals[k].c,0);
  const loggedF = Object.keys(state.today.mealsLogged).filter(k=>state.today.mealsLogged[k]).reduce((s,k)=>s+meals[k].f,0);
  let html = `
    <p class="eyebrow">Hôm nay</p>
    <h2 class="h-page">Dinh dưỡng</h2>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <span class="metric-num" style="font-size:26px;">${fmt(loggedKcal)}</span>
        <span class="muted small">trên ${fmt(m.target)} kcal mục tiêu</span>
      </div>
      <div class="progress-track" style="margin-bottom:16px;"><div class="progress-fill moss" style="width:${Math.min(100,loggedKcal/m.target*100)}%"></div></div>
      <div class="row">
        <div class="col" style="text-align:center;"><div class="metric-label">Protein</div><div style="font-weight:600;">${loggedP} / ${m.protein}g</div></div>
        <div class="col" style="text-align:center;"><div class="metric-label">Carbs</div><div style="font-weight:600;">${loggedC} / ${m.carbs}g</div></div>
        <div class="col" style="text-align:center;"><div class="metric-label">Fat</div><div style="font-weight:600;">${loggedF} / ${m.fat}g</div></div>
      </div>
    </div>
    <div class="h-section" style="margin-top:16px;">Thực đơn hôm nay</div>
    <div class="card">
      ${['breakfast','lunch','dinner','snack'].map(t=>{
        const meal = meals[t];
        const label = {breakfast:'Bữa sáng',lunch:'Bữa trưa',dinner:'Bữa tối',snack:'Bữa phụ'}[t];
        const logged = !!state.today.mealsLogged[t];
        return `<div class="mealcard">
          <button class="checkbtn ${logged?'done':''}" onclick="toggleMealLogged('${t}')">${logged?'✓':''}</button>
          <div style="flex:1;">
            <div class="mealtag">${label}</div>
            <div class="mealname" onclick="openMealDetail('${t}')">${meal.name}</div>
            <div class="mealkcal">${meal.kcal} kcal · P${meal.p} C${meal.c} F${meal.f}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  setScreen(html);
}
function toggleMealLogged(t){ state.today.mealsLogged[t] = !state.today.mealsLogged[t]; renderMealsTab(); }
function openMealDetail(t){
  const meal = state.plan.mealDay[t];
  const dietKey = state.foodPrefs.diet==='unrestricted'||state.foodPrefs.diet==='halal'||state.foodPrefs.diet==='other' ? 'any' : state.foodPrefs.diet;
  const options = MEALLIB.filter(x=>x.type===t && x.id!==meal.id && (dietKey==='any'||x.diet.includes(dietKey)) && !x.allergens.some(a=>state.foodPrefs.allergies.includes(a)));
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet">
        <button class="modal-close" onclick="closeModal()">Đóng</button>
        <h2 style="font-size:22px;font-weight:600;margin:10px 0 2px;">${meal.name}</h2>
        <p class="muted small" style="margin:0 0 14px;">${meal.kcal} kcal</p>
        <div class="row" style="margin-bottom:16px;">
          <div class="col card flat" style="text-align:center;padding:12px;"><div class="metric-label">Protein</div><div style="font-weight:600;">${meal.p}g</div></div>
          <div class="col card flat" style="text-align:center;padding:12px;"><div class="metric-label">Carbs</div><div style="font-weight:600;">${meal.c}g</div></div>
          <div class="col card flat" style="text-align:center;padding:12px;"><div class="metric-label">Fat</div><div style="font-weight:600;">${meal.f}g</div></div>
        </div>
        <p style="font-weight:600;margin:0 0 6px;">Nguyên liệu</p>
        <p class="muted small" style="margin:0 0 14px;">${meal.ing.join(', ')}</p>
        <p style="font-weight:600;margin:0 0 6px;">Cách làm</p>
        <ol class="muted small" style="margin:0 0 16px;padding-left:18px;">${meal.steps.map(s=>`<li style="margin-bottom:4px;">${s}</li>`).join('')}</ol>
        ${options.length ? `
          <p style="font-weight:600;margin:0 0 8px;">Không thích món này?</p>
          <div class="seg" style="flex-direction:column;">
            ${options.slice(0,3).map(o=>`<div class="seg-opt wide c-moss" onclick="replaceMeal('${t}','${o.id}')"><div><div class="opt-title">${o.name}</div><div class="opt-sub">${o.kcal} kcal</div></div></div>`).join('')}
          </div>
        ` : ''}
      </div>
    </div>`;
}
function replaceMeal(t,newId){
  state.plan.mealDay[t] = MEALLIB.find(m=>m.id===newId);
  closeModal();
  renderMealsTab();
}

/* ================= PROGRESS TAB ================= */
function renderProgressTab(){
  saveState();
  const hist = state.logs.weightHistory;
  const weeksTrained = state.logs.workoutHistory.length;
  const weeklyTarget = state.workoutPrefs.days;
  let html = `
    <p class="eyebrow">Theo dõi</p>
    <h2 class="h-page">Tiến độ</h2>
    <div class="h-section">Cân nặng</div>
    <div class="card">
      ${weightChartSvg(hist)}
      <button class="btn plum small-btn" style="margin-top:12px;" onclick="promptWeight()">Cập nhật cân nặng</button>
    </div>
    <div class="metric-grid">
      <div class="card flat"><div class="metric-label">Buổi tập đã hoàn thành</div><div class="metric-num">${weeksTrained}</div></div>
      <div class="card flat"><div class="metric-label">Mục tiêu mỗi tuần</div><div class="metric-num">${weeklyTarget}</div></div>
    </div>
    <div class="h-section" style="margin-top:16px;">Lịch sử cân nặng</div>
    <div class="card">
      ${hist.slice().reverse().map(h=>`<div class="weight-chip"><span class="muted">${h.date.toLocaleDateString('vi-VN')}</span><span style="font-weight:600;">${h.weight} kg</span></div>`).join('')}
    </div>
  `;
  setScreen(html);
}
function weightChartSvg(hist){
  if(hist.length<2){
    return `<p class="muted small">Cập nhật cân nặng thêm vài lần để xem biểu đồ tiến độ.</p>`;
  }
  const w=300,h=110,pad=10;
  const weights = hist.map(x=>x.weight);
  const min = Math.min(...weights)-0.5, max = Math.max(...weights)+0.5;
  const pts = hist.map((x,i)=>{
    const px = pad + (i/(hist.length-1))*(w-2*pad);
    const py = h-pad - ((x.weight-min)/(max-min))*(h-2*pad);
    return `${px},${py}`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <polyline points="${pts.join(' ')}" fill="none" stroke="#6B4058" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>{const [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="3" fill="#6B4058"/>`;}).join('')}
  </svg>`;
}
function promptWeight(){
  const v = prompt('Cân nặng hiện tại (kg):', state.profile.weight);
  if(v===null) return;
  const n = parseFloat(v);
  if(!n || n<=0){ alert('Vui lòng nhập số hợp lệ.'); return; }
  state.profile.weight = n;
  state.logs.weightHistory.push({date:new Date(), weight:n});
  calcMetrics();
  renderProgressTab();
}

/* ================= PROFILE TAB ================= */
function renderProfileTab(){
  saveState();
  const p = state.profile, m = state.metrics;
  let html = `
    <p class="eyebrow">Hồ sơ</p>
    <h2 class="h-page">${p.name}</h2>
    <div class="metric-grid">
      <div class="card flat"><div class="metric-label">Cân nặng</div><div class="metric-num" style="font-size:24px;">${p.weight} kg</div></div>
      <div class="card flat"><div class="metric-label">Chiều cao</div><div class="metric-num" style="font-size:24px;">${p.height} cm</div></div>
      <div class="card flat"><div class="metric-label">BMI</div><div class="metric-num" style="font-size:24px;">${m.bmi}</div><div class="metric-label">${m.bmiLabel}</div></div>
      <div class="card flat"><div class="metric-label">TDEE ước tính</div><div class="metric-num" style="font-size:24px;">${fmt(m.tdee)}</div></div>
    </div>
    <div class="h-section" style="margin-top:16px;">Thông tin</div>
    <div class="card">
      <div class="weight-chip"><span class="muted">Mục tiêu</span><span style="font-weight:600;">${GOAL_LABELS[state.goal]}</span></div>
      <div class="weight-chip"><span class="muted">Mức hoạt động</span><span style="font-weight:600;">${ACTIVITY_LABELS[state.activity]}</span></div>
      <div class="weight-chip"><span class="muted">Tập luyện</span><span style="font-weight:600;">${state.workoutPrefs.days} ngày / tuần</span></div>
      <div class="weight-chip"><span class="muted">Chế độ ăn</span><span style="font-weight:600;">${dietLabel(state.foodPrefs.diet)}</span></div>
    </div>
    <div class="h-section" style="margin-top:16px;">Tuỳ chọn</div>
    <div class="card">
      <button class="btn secondary" style="margin-bottom:10px;" onclick="editProfile()">Chỉnh sửa thông tin cá nhân</button>
      <button class="btn secondary" style="margin-bottom:10px;" onclick="recalcAll()">Tính lại kế hoạch</button>
      <button class="btn ghost" style="color:var(--danger);" onclick="resetApp()">Bắt đầu lại từ đầu</button>
    </div>
  `;
  setScreen(html);
}
function dietLabel(d){ return {unrestricted:'Không giới hạn',vegetarian:'Vegetarian',vegan:'Vegan',halal:'Halal',other:'Khác'}[d]||d; }
function editProfile(){
  const p = state.profile;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet">
        <button class="modal-close" onclick="closeModal()">Đóng</button>
        <h2 style="font-size:20px;font-weight:600;margin:10px 0 16px;">Chỉnh sửa thông tin</h2>
        <div class="field"><label>Tên</label><input type="text" id="ed-name" value="${p.name}"></div>
        <div class="row">
          <div class="col field"><label>Tuổi</label><input type="number" id="ed-age" value="${p.age}"></div>
          <div class="col field"><label>Cân nặng (kg)</label><input type="number" id="ed-weight" value="${p.weight}"></div>
        </div>
        <div class="field"><label>Chiều cao (cm)</label><input type="number" id="ed-height" value="${p.height}"></div>
        <button class="btn indigo" onclick="saveProfileEdit()">Lưu thay đổi</button>
      </div>
    </div>`;
}
function saveProfileEdit(){
  const age=el('ed-age').value, height=el('ed-height').value, weight=el('ed-weight').value, name=el('ed-name').value.trim();
  if(!age||!height||!weight||parseFloat(height)<=0||parseFloat(weight)<=0){ alert('Vui lòng nhập giá trị hợp lệ.'); return; }
  const weightChanged = parseFloat(weight)!==parseFloat(state.profile.weight);
  state.profile = {...state.profile, name:name||state.profile.name, age, height, weight};
  if(weightChanged) state.logs.weightHistory.push({date:new Date(), weight:parseFloat(weight)});
  calcMetrics();
  closeModal();
  renderProfileTab();
}
function recalcAll(){
  calcMetrics();
  generateWorkoutPlan();
  generateMealPlan();
  state.today = {mealsLogged:{}, workoutDone:false};
  renderProfileTab();
}
function resetApp(){
  if(!confirm('Xoá toàn bộ dữ liệu và bắt đầu lại từ đầu?')) return;
  clearState();
  state = {
    onboarded:false, obStep:0, currentTab:'home',
    profile:{name:'',age:'',sex:'nam',height:'',weight:''},
    activity:'moderate', goal:null,
    workoutPrefs:{days:3,duration:30,location:'home',equipment:['none']},
    foodPrefs:{diet:'unrestricted',allergies:[],dislikes:'',budget:'medium'},
    metrics:null, plan:{workoutWeek:null,mealDay:null},
    logs:{weightHistory:[],workoutHistory:[]},
    today:{mealsLogged:{},workoutDone:false}, session:null, selectedDayIndex:0,
  };
  navEl.style.display='none';
  renderOnboarding();
}

/* ================= CLOCK ================= */
function tickClock(){
  const d = new Date();
  el('clock').textContent = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
setInterval(tickClock,1000*20);
tickClock();

/* ================= INIT ================= */
function initApp(){
  const loaded = loadState();
  const ready = loaded && state.onboarded && state.metrics && state.plan && state.plan.workoutWeek && state.plan.mealDay;
  if(ready){
    renderNav();
    renderCurrentTab();
  } else {
    state.onboarded = false;
    renderOnboarding();
  }
}
initApp();
</script>
</body>
</html>
